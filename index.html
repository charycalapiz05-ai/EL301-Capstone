<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Greenhouse A — Node Console</title>
<style>
  :root{
    --soil: #2f3d2a;
    --leaf: #6a9955;
    --leaf-light: #a9c98f;
    --paper: #f6f5ef;
    --bark: #4a3f35;
    --alert: #b5502f;
    --line: #d8d5c8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--soil);
    color:var(--paper);
    font-family: "Iowan Old Style", "Georgia", serif;
    min-height:100vh;
  }
  header{
    padding: 28px 32px 18px;
    border-bottom: 1px solid rgba(246,245,239,0.15);
  }
  header h1{
    margin:0;
    font-size: 1.6rem;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  header .sub{
    color: var(--leaf-light);
    font-size: 0.95rem;
    margin-top: 4px;
  }
  #status{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--alert);
    margin-right:8px;
    vertical-align:middle;
  }
  #status.connected{ background: var(--leaf); }

  main{
    display:grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 24px;
    padding: 24px 32px 40px;
  }
  @media (max-width: 820px){
    main{ grid-template-columns: 1fr; }
  }

  section{
    background: rgba(246,245,239,0.04);
    border: 1px solid rgba(246,245,239,0.12);
    border-radius: 4px;
    padding: 20px;
  }
  section h2{
    margin: 0 0 14px;
    font-size: 1rem;
    font-weight: 500;
    color: var(--leaf-light);
  }

  .readings{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .card{
    background: var(--paper);
    color: var(--bark);
    border-radius: 3px;
    padding: 14px 16px;
  }
  .card .label{
    font-size: 0.78rem;
    color: #6b6152;
  }
  .card .value{
    font-size: 1.7rem;
    line-height: 1.3;
    font-variant-numeric: tabular-nums;
  }
  .card .unit{ font-size: 1rem; color:#6b6152; }
  .card.alert{ outline: 2px solid var(--alert); }

  .controls{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 6px;
  }
  button{
    font-family: inherit;
    font-size: 0.92rem;
    padding: 10px 16px;
    border-radius: 3px;
    border: 1px solid var(--leaf-light);
    background: transparent;
    color: var(--paper);
    cursor: pointer;
  }
  button:hover{ background: rgba(169,201,143,0.15); }
  button.primary{ background: var(--leaf); border-color: var(--leaf); color: var(--soil); }
  button.primary:hover{ background: var(--leaf-light); }

  #log{
    height: 340px;
    overflow-y: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.8rem;
    line-height: 1.5;
    color: var(--leaf-light);
  }
  #log div{ border-bottom: 1px dotted rgba(246,245,239,0.08); padding: 3px 0; }
  #log div.rx{ color: var(--paper); }
  #log div.alert{ color: #e2a37c; }
  #log div.tx{ color: #8fb8e8; }
</style>
</head>
<body>

<header>
  <h1>Greenhouse A — Node Console</h1>
  <div class="sub"><span id="status"></span><span id="statusText">connecting…</span></div>
</header>

<main>
  <section>
    <h2>Live readings — esp32-greenhouse-01</h2>
    <div class="readings" id="readings">
      <div class="card"><div class="label">Temperature</div><div class="value">— <span class="unit">°C</span></div></div>
      <div class="card"><div class="label">Humidity</div><div class="value">— <span class="unit">%</span></div></div>
      <div class="card"><div class="label">Soil moisture</div><div class="value">— <span class="unit">%</span></div></div>
      <div class="card"><div class="label">Pump status</div><div class="value" id="pumpStatus">unknown</div></div>
    </div>

    <h2 style="margin-top:24px;">Send a command</h2>
    <div class="controls">
      <button class="primary" onclick="sendCommand('pump_on')">Pump ON</button>
      <button onclick="sendCommand('pump_off')">Pump OFF</button>
      <button onclick="sendCommand('buzzer_test')">Test buzzer</button>
    </div>
  </section>

  <section>
    <h2>Message log</h2>
    <div id="log"></div>
  </section>
</main>

<script>
  // Point this at the same server your ESP32 sketch connects to.
  const WS_URL = "wss://your-server-host.onrender.com";

  const statusDot = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const logEl = document.getElementById('log');
  const readingsEl = document.getElementById('readings');
  const cards = readingsEl.querySelectorAll('.card');
  const pumpStatusEl = document.getElementById('pumpStatus');

  let ws;

  function connect() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      statusDot.classList.add('connected');
      statusText.textContent = 'connected to server';
      logLine('Connected to ' + WS_URL, 'rx');
    };

    ws.onclose = () => {
      statusDot.classList.remove('connected');
      statusText.textContent = 'disconnected — retrying…';
      setTimeout(connect, 3000);
    };

    ws.onerror = () => logLine('WebSocket error', 'alert');

    ws.onmessage = (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { logLine('Bad JSON: ' + evt.data, 'alert'); return; }
      handleMessage(msg);
    };
  }

  function handleMessage(msg) {
    const cls = msg.type === 'alert' ? 'alert' : 'rx';
    logLine(`[${msg.type}] ${msg.device_id || ''} ${msg.sensor || msg.action || ''} ${msg.value ?? msg.result ?? ''}`, cls);

    if (msg.type === 'sensor_data' || msg.type === 'alert') {
      updateReading(msg);
    }
  }

  function updateReading(msg) {
    const idx = { temperature: 0, humidity: 1, soil_moisture: 2 }[msg.sensor];
    if (idx === undefined) return;
    const card = cards[idx];
    const valueEl = card.querySelector('.value');
    valueEl.innerHTML = `${msg.value} <span class="unit">${msg.unit}</span>`;
    card.classList.toggle('alert', msg.type === 'alert');

    if (msg.sensor === 'soil_moisture' && msg.status === 'auto_irrigation_triggered') {
      pumpStatusEl.textContent = 'auto ON (dry soil)';
    }
  }

  function sendCommand(action) {
    const cmd = { type: 'command', device_id: 'esp32-greenhouse-01', action };
    ws.send(JSON.stringify(cmd));
    logLine('Sent command: ' + action, 'tx');
    if (action === 'pump_on') pumpStatusEl.textContent = 'ON (manual)';
    if (action === 'pump_off') pumpStatusEl.textContent = 'OFF (manual)';
  }

  function logLine(text, cls) {
    const div = document.createElement('div');
    div.className = cls || '';
    div.textContent = new Date().toLocaleTimeString() + '  ' + text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  connect();
</script>
</body>
</html>
